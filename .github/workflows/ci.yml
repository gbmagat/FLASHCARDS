name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit pushed to main gets its own run. A new push to a pull request
# cancels that pull request's older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        # The github-actions reporter turns each failing test into an
        # annotation on the commit or pull request.
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build
        run: npm run build
